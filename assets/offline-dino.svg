<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="84" viewBox="0 0 1000 84" role="img" aria-label="Pixel-art dinosaur running and jumping over cacti, like the Chrome offline game">
<title>Offline dino runner</title>
<style>
  .ink   { fill: #5f6368; }
  .faint { fill: #c4c7c5; }
  @media (prefers-color-scheme: dark) {
    .ink   { fill: #9aa0a6; }
    .faint { fill: #4a4e52; }
  }
  .scroll { animation: scroll 0.630s linear infinite; }
  .obs    { animation: obs 3.4s linear infinite; }
  .obs2   { animation-delay: -1.7s; }
  .dino   { animation: jump 1.7s linear infinite; }
  .legA   { animation: alt .2s steps(1, end) infinite; }
  .legB   { animation: alt .2s steps(1, end) infinite; animation-delay: -.1s; }
  .run    { animation: onGround 1.7s steps(1, end) infinite; }
  .tuck   { animation: airborne 1.7s steps(1, end) infinite; }
  .cloudA { animation: cloud 24s linear infinite; }
  .cloudB { animation: cloud 33s linear infinite; animation-delay: -15s; }

  @keyframes scroll { from { transform: translateX(0); }
                      to   { transform: translateX(-200px); } }
  @keyframes obs    { from { transform: translateX(1040px); }
                      to   { transform: translateX(-40px); } }
  @keyframes cloud  { from { transform: translateX(1030px); }
                      to   { transform: translateX(-70px); } }
  @keyframes alt    { 0% { opacity: 1; } 50%, 100% { opacity: 0; } }
  /* legs cycle only while the feet are down, freeze in a tuck while airborne */
  @keyframes onGround { 0% { opacity: 1; }
                         63.0% { opacity: 0; }
                         92.4%, 100% { opacity: 1; } }
  @keyframes airborne { 0% { opacity: 0; }
                         63.0% { opacity: 1; }
                         92.4%, 100% { opacity: 0; } }
  /* parabolic hop, phase-locked so the apex lands on the cactus */
  @keyframes jump {
  0%, 63.0% { transform: translateY(0); }
  66.7% { transform: translateY(-14.9px); }
  70.3% { transform: translateY(-25.5px); }
  74.0% { transform: translateY(-31.9px); }
  77.7% { transform: translateY(-34px); }
  81.4% { transform: translateY(-31.9px); }
  85.0% { transform: translateY(-25.5px); }
  88.7% { transform: translateY(-14.9px); }
  92.4%, 100% { transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll, .obs, .dino, .legA, .legB, .run, .tuck,
    .cloudA, .cloudB { animation: none; }
    .legB, .tuck { opacity: 0; }
  }
</style>

<g class="faint">
  <g class="cloudA"><rect x="6" y="9" width="9" height="1.5"/><rect x="3" y="10.5" width="15" height="1.5"/><rect x="1.5" y="12" width="19.5" height="1.5"/><rect x="0" y="13.5" width="21" height="1.5"/><rect x="1.5" y="15" width="18" height="1.5"/></g>
  <g class="cloudB"><rect x="6" y="26" width="9" height="1.5"/><rect x="3" y="27.5" width="15" height="1.5"/><rect x="1.5" y="29" width="19.5" height="1.5"/><rect x="0" y="30.5" width="21" height="1.5"/><rect x="1.5" y="32" width="18" height="1.5"/></g>
</g>

<g class="ink scroll"><rect x="0" y="74" width="200" height="1.5"/><rect x="7" y="77.5" width="4" height="1.5"/><rect x="31" y="77.5" width="7" height="1.5"/><rect x="58" y="77.5" width="3" height="1.5"/><rect x="77" y="77.5" width="9" height="1.5"/><rect x="104" y="77.5" width="5" height="1.5"/><rect x="129" y="77.5" width="8" height="1.5"/><rect x="151" y="77.5" width="3" height="1.5"/><rect x="172" y="77.5" width="6" height="1.5"/><rect x="191" y="77.5" width="4" height="1.5"/><rect x="200" y="74" width="200" height="1.5"/><rect x="207" y="77.5" width="4" height="1.5"/><rect x="231" y="77.5" width="7" height="1.5"/><rect x="258" y="77.5" width="3" height="1.5"/><rect x="277" y="77.5" width="9" height="1.5"/><rect x="304" y="77.5" width="5" height="1.5"/><rect x="329" y="77.5" width="8" height="1.5"/><rect x="351" y="77.5" width="3" height="1.5"/><rect x="372" y="77.5" width="6" height="1.5"/><rect x="391" y="77.5" width="4" height="1.5"/><rect x="400" y="74" width="200" height="1.5"/><rect x="407" y="77.5" width="4" height="1.5"/><rect x="431" y="77.5" width="7" height="1.5"/><rect x="458" y="77.5" width="3" height="1.5"/><rect x="477" y="77.5" width="9" height="1.5"/><rect x="504" y="77.5" width="5" height="1.5"/><rect x="529" y="77.5" width="8" height="1.5"/><rect x="551" y="77.5" width="3" height="1.5"/><rect x="572" y="77.5" width="6" height="1.5"/><rect x="591" y="77.5" width="4" height="1.5"/><rect x="600" y="74" width="200" height="1.5"/><rect x="607" y="77.5" width="4" height="1.5"/><rect x="631" y="77.5" width="7" height="1.5"/><rect x="658" y="77.5" width="3" height="1.5"/><rect x="677" y="77.5" width="9" height="1.5"/><rect x="704" y="77.5" width="5" height="1.5"/><rect x="729" y="77.5" width="8" height="1.5"/><rect x="751" y="77.5" width="3" height="1.5"/><rect x="772" y="77.5" width="6" height="1.5"/><rect x="791" y="77.5" width="4" height="1.5"/><rect x="800" y="74" width="200" height="1.5"/><rect x="807" y="77.5" width="4" height="1.5"/><rect x="831" y="77.5" width="7" height="1.5"/><rect x="858" y="77.5" width="3" height="1.5"/><rect x="877" y="77.5" width="9" height="1.5"/><rect x="904" y="77.5" width="5" height="1.5"/><rect x="929" y="77.5" width="8" height="1.5"/><rect x="951" y="77.5" width="3" height="1.5"/><rect x="972" y="77.5" width="6" height="1.5"/><rect x="991" y="77.5" width="4" height="1.5"/><rect x="1000" y="74" width="200" height="1.5"/><rect x="1007" y="77.5" width="4" height="1.5"/><rect x="1031" y="77.5" width="7" height="1.5"/><rect x="1058" y="77.5" width="3" height="1.5"/><rect x="1077" y="77.5" width="9" height="1.5"/><rect x="1104" y="77.5" width="5" height="1.5"/><rect x="1129" y="77.5" width="8" height="1.5"/><rect x="1151" y="77.5" width="3" height="1.5"/><rect x="1172" y="77.5" width="6" height="1.5"/><rect x="1191" y="77.5" width="4" height="1.5"/></g>

<g class="ink">
  <g class="obs"><rect x="3" y="56" width="4.5" height="6"/><rect x="0" y="59" width="1.5" height="3"/><rect x="9" y="60.5" width="1.5" height="6"/><rect x="0" y="62" width="7.5" height="3"/><rect x="3" y="65" width="4.5" height="1.5"/><rect x="3" y="66.5" width="7.5" height="1.5"/><rect x="3" y="68" width="4.5" height="6"/></g>
  <g class="obs obs2"><rect x="4.5" y="48.5" width="6" height="9"/><rect x="0" y="53" width="1.5" height="4.5"/><rect x="13.5" y="54.5" width="1.5" height="9"/><rect x="0" y="57.5" width="10.5" height="3"/><rect x="4.5" y="60.5" width="6" height="3"/><rect x="4.5" y="63.5" width="10.5" height="1.5"/><rect x="4.5" y="65" width="6" height="9"/></g>
</g>

<g class="ink dino">
  <rect x="92.5" y="38" width="9" height="1.5"/><rect x="91" y="39.5" width="13.5" height="3"/><rect x="91" y="42.5" width="3" height="1.5"/><rect x="95.5" y="42.5" width="10.5" height="1.5"/><rect x="91" y="44" width="13.5" height="3"/><rect x="89.5" y="47" width="15" height="1.5"/><rect x="89.5" y="48.5" width="9" height="1.5"/><rect x="70" y="50" width="1.5" height="1.5"/><rect x="89.5" y="50" width="7.5" height="1.5"/><rect x="70" y="51.5" width="3" height="1.5"/><rect x="89.5" y="51.5" width="9" height="1.5"/><rect x="70" y="53" width="4.5" height="1.5"/><rect x="88" y="53" width="10.5" height="1.5"/><rect x="71.5" y="54.5" width="6" height="1.5"/><rect x="86.5" y="54.5" width="12" height="1.5"/><rect x="73" y="56" width="27" height="1.5"/><rect x="74.5" y="57.5" width="24" height="1.5"/><rect x="76" y="59" width="21" height="1.5"/><rect x="77.5" y="60.5" width="19.5" height="1.5"/><rect x="79" y="62" width="18" height="1.5"/><rect x="80.5" y="63.5" width="16.5" height="1.5"/><rect x="80.5" y="65" width="15" height="1.5"/><rect x="80.5" y="66.5" width="13.5" height="1.5"/>
  <g class="run">
    <g class="legA"><rect x="80.5" y="68" width="3" height="4.5"/><rect x="88" y="68" width="3" height="3"/><rect x="79" y="72.5" width="6" height="1.5"/></g>
    <g class="legB"><rect x="80.5" y="68" width="3" height="3"/><rect x="88" y="68" width="3" height="4.5"/><rect x="86.5" y="72.5" width="6" height="1.5"/></g>
  </g>
  <g class="tuck"><rect x="80.5" y="68" width="3" height="1.5"/><rect x="88" y="68" width="3" height="1.5"/><rect x="79" y="69.5" width="4.5" height="1.5"/><rect x="88" y="69.5" width="4.5" height="1.5"/></g>
