<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img" aria-label="Pixel-art dinosaur running and jumping over cacti, like the Chrome offline game">
<title>Offline dino runner</title>
<style>
  .ink   { fill: #5f6368; }
  .faint { fill: #b7b7b7; }
  @media (prefers-color-scheme: dark) {
    .ink   { fill: #9aa0a6; }
    .faint { fill: #5f6368; }
  }
  .scroll { animation: scroll 1.886s linear infinite; }
  .obs    { animation: obs 2.2s linear infinite; }
  .obs2   { animation-delay: -1.1s; }
  .dino   { animation: jump 1.1s linear infinite; }
  .legA   { animation: alt .22s steps(1, end) infinite; }
  .legB   { animation: alt .22s steps(1, end) infinite; animation-delay: -.11s; }
  .run    { animation: onGround 1.1s steps(1, end) infinite; }
  .tuck   { animation: airborne 1.1s steps(1, end) infinite; }
  .bird   { animation: bird 7s linear infinite; }
  .wingU  { animation: alt .3s steps(1, end) infinite; }
  .wingD  { animation: alt .3s steps(1, end) infinite; animation-delay: -.15s; }
  .cloudA { animation: cloud 22s linear infinite; }
  .cloudB { animation: cloud 31s linear infinite; animation-delay: -14s; }

  @keyframes scroll { from { transform: translateX(0); }
                      to   { transform: translateX(-600px); } }
  @keyframes obs    { from { transform: translateX(640px); }
                      to   { transform: translateX(-60px); } }
  @keyframes bird   { from { transform: translateX(660px); }
                      to   { transform: translateX(-60px); } }
  @keyframes cloud  { from { transform: translateX(620px); }
                      to   { transform: translateX(-90px); } }
  @keyframes alt    { 0% { opacity: 1; } 50%, 100% { opacity: 0; } }
  /* legs cycle only while the feet are down, freeze in a tuck while airborne */
  @keyframes onGround { 0% { opacity: 1; }
                         38.0% { opacity: 0; }
                         88.9%, 100% { opacity: 1; } }
  @keyframes airborne { 0% { opacity: 0; }
                         38.0% { opacity: 1; }
                         88.9%, 100% { opacity: 0; } }
  /* parabolic hop, phase-locked so the apex lands on the cactus */
  @keyframes jump {
  0%, 38.0% { transform: translateY(0); }
  44.3% { transform: translateY(-20px); }
  50.7% { transform: translateY(-34px); }
  57.1% { transform: translateY(-43px); }
  63.4% { transform: translateY(-46px); }
  69.8% { transform: translateY(-43px); }
  76.2% { transform: translateY(-34px); }
  82.5% { transform: translateY(-20px); }
  88.9%, 100% { transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll, .obs, .dino, .legA, .legB, .run, .tuck,
    .bird, .wingU, .wingD, .cloudA, .cloudB { animation: none; }
    .legB, .wingD, .tuck { opacity: 0; }
  }
</style>

<g class="faint">
  <g class="cloudA"><rect x="8" y="32" width="12" height="2"/><rect x="4" y="34" width="20" height="2"/><rect x="2" y="36" width="26" height="2"/><rect x="0" y="38" width="28" height="2"/><rect x="2" y="40" width="24" height="2"/></g>
  <g class="cloudB"><rect x="8" y="54" width="12" height="2"/><rect x="4" y="56" width="20" height="2"/><rect x="2" y="58" width="26" height="2"/><rect x="0" y="60" width="28" height="2"/><rect x="2" y="62" width="24" height="2"/></g>
</g>

<g class="ink scroll"><rect x="0" y="127" width="200" height="2"/><rect x="7" y="131" width="4" height="2"/><rect x="31" y="131" width="7" height="2"/><rect x="58" y="131" width="3" height="2"/><rect x="77" y="131" width="9" height="2"/><rect x="104" y="131" width="5" height="2"/><rect x="129" y="131" width="8" height="2"/><rect x="151" y="131" width="3" height="2"/><rect x="172" y="131" width="6" height="2"/><rect x="191" y="131" width="4" height="2"/><rect x="200" y="127" width="200" height="2"/><rect x="207" y="131" width="4" height="2"/><rect x="231" y="131" width="7" height="2"/><rect x="258" y="131" width="3" height="2"/><rect x="277" y="131" width="9" height="2"/><rect x="304" y="131" width="5" height="2"/><rect x="329" y="131" width="8" height="2"/><rect x="351" y="131" width="3" height="2"/><rect x="372" y="131" width="6" height="2"/><rect x="391" y="131" width="4" height="2"/><rect x="400" y="127" width="200" height="2"/><rect x="407" y="131" width="4" height="2"/><rect x="431" y="131" width="7" height="2"/><rect x="458" y="131" width="3" height="2"/><rect x="477" y="131" width="9" height="2"/><rect x="504" y="131" width="5" height="2"/><rect x="529" y="131" width="8" height="2"/><rect x="551" y="131" width="3" height="2"/><rect x="572" y="131" width="6" height="2"/><rect x="591" y="131" width="4" height="2"/><rect x="600" y="127" width="200" height="2"/><rect x="607" y="131" width="4" height="2"/><rect x="631" y="131" width="7" height="2"/><rect x="658" y="131" width="3" height="2"/><rect x="677" y="131" width="9" height="2"/><rect x="704" y="131" width="5" height="2"/><rect x="729" y="131" width="8" height="2"/><rect x="751" y="131" width="3" height="2"/><rect x="772" y="131" width="6" height="2"/><rect x="791" y="131" width="4" height="2"/><rect x="800" y="127" width="200" height="2"/><rect x="807" y="131" width="4" height="2"/><rect x="831" y="131" width="7" height="2"/><rect x="858" y="131" width="3" height="2"/><rect x="877" y="131" width="9" height="2"/><rect x="904" y="131" width="5" height="2"/><rect x="929" y="131" width="8" height="2"/><rect x="951" y="131" width="3" height="2"/><rect x="972" y="131" width="6" height="2"/><rect x="991" y="131" width="4" height="2"/><rect x="1000" y="127" width="200" height="2"/><rect x="1007" y="131" width="4" height="2"/><rect x="1031" y="131" width="7" height="2"/><rect x="1058" y="131" width="3" height="2"/><rect x="1077" y="131" width="9" height="2"/><rect x="1104" y="131" width="5" height="2"/><rect x="1129" y="131" width="8" height="2"/><rect x="1151" y="131" width="3" height="2"/><rect x="1172" y="131" width="6" height="2"/><rect x="1191" y="131" width="4" height="2"/></g>

<g class="ink">
  <g class="obs"><rect x="4" y="103" width="6" height="8"/><rect x="0" y="107" width="2" height="4"/><rect x="12" y="109" width="2" height="8"/><rect x="0" y="111" width="10" height="4"/><rect x="4" y="115" width="6" height="2"/><rect x="4" y="117" width="10" height="2"/><rect x="4" y="119" width="6" height="8"/></g>
  <g class="obs obs2"><rect x="6" y="93" width="8" height="12"/><rect x="0" y="99" width="2" height="6"/><rect x="18" y="101" width="2" height="12"/><rect x="0" y="105" width="14" height="4"/><rect x="6" y="109" width="8" height="4"/><rect x="6" y="113" width="14" height="2"/><rect x="6" y="115" width="8" height="12"/></g>
  <g class="bird" transform="translate(0,12)">
    <g class="wingU"><rect x="4" y="0" width="4" height="2"/><rect x="2" y="2" width="8" height="2"/><rect x="4" y="4" width="12" height="2"/><rect x="6" y="6" width="18" height="2"/><rect x="4" y="8" width="12" height="2"/></g>
    <g class="wingD"><rect x="4" y="4" width="12" height="2"/><rect x="6" y="6" width="18" height="2"/><rect x="4" y="8" width="12" height="2"/><rect x="2" y="10" width="8" height="2"/><rect x="4" y="12" width="4" height="2"/></g>
  </g>
</g>

<g class="ink dino">
  <rect x="84" y="79" width="12" height="2"/><rect x="82" y="81" width="18" height="4"/><rect x="82" y="85" width="4" height="2"/><rect x="88" y="85" width="14" height="2"/><rect x="82" y="87" width="18" height="4"/><rect x="80" y="91" width="20" height="2"/><rect x="80" y="93" width="12" height="2"/><rect x="54" y="95" width="2" height="2"/><rect x="80" y="95" width="10" height="2"/><rect x="54" y="97" width="4" height="2"/><rect x="80" y="97" width="12" height="2"/><rect x="54" y="99" width="6" height="2"/><rect x="78" y="99" width="14" height="2"/><rect x="56" y="101" width="8" height="2"/><rect x="76" y="101" width="16" height="2"/><rect x="58" y="103" width="36" height="2"/><rect x="60" y="105" width="32" height="2"/><rect x="62" y="107" width="28" height="2"/><rect x="64" y="109" width="26" height="2"/><rect x="66" y="111" width="24" height="2"/><rect x="68" y="113" width="22" height="2"/><rect x="68" y="115" width="20" height="2"/><rect x="68" y="117" width="18" height="2"/>
  <g class="run">
