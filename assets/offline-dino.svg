<svg xmlns="http://www.w3.org/2000/svg" width="220" height="34" viewBox="0 0 220 34" role="img" aria-label="Offline dino runner">
  <style>
    .runner { animation: hop 0.72s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .obstacle { animation: slide 1.8s linear infinite; }
    .obstacle.two { animation-delay: -0.9s; }
    @keyframes hop {
      0%, 45%, 100% { transform: translateY(0); }
      18%, 28% { transform: translateY(-8px); }
    }
    @keyframes slide {
      from { transform: translateX(220px); }
      to { transform: translateX(-28px); }
    }
  </style>
  <rect width="220" height="34" fill="none"/>
  <line x1="0" y1="29" x2="220" y2="29" stroke="#6a737d" stroke-width="2"/>
  <g class="runner" fill="#c9d1d9">
    <rect x="31" y="9" width="18" height="12" rx="2"/>
    <rect x="46" y="13" width="7" height="7" rx="1"/>
    <rect x="28" y="18" width="16" height="8" rx="2"/>
    <rect x="25" y="21" width="5" height="3"/>
    <rect x="33" y="26" width="4" height="5"/>
    <rect x="43" y="26" width="4" height="5"/>
    <rect x="45" y="12" width="2" height="2" fill="#0d1117"/>
  </g>
  <g class="obstacle" fill="#8b949e">
    <rect x="0" y="17" width="4" height="12" rx="1"/>
    <rect x="-4" y="21" width="4" height="3"/>
    <rect x="4" y="19" width="4" height="3"/>
  </g>
  <g class="obstacle two" fill="#8b949e">
    <rect x="0" y="15" width="5" height="14" rx="1"/>
    <rect x="-4" y="20" width="4" height="3"/>
    <rect x="5" y="18" width="4" height="3"/>
  </g>
</svg>
